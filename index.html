<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>내 가계부</title>
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14282e;--sub:#6b7f86;--line:#dde5e8;--in:#2563eb;--out:#e0475b;--brand:#0f766e;--brand2:#14b8a6;--chip:#e6eef0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--card:#172a30;--ink:#e8f1f3;--sub:#8ea5ac;--line:#25393f;--in:#6ea0ff;--out:#ff7a8b;--brand:#2dd4bf;--brand2:#0f766e;--chip:#1f343a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a1e;--card:#172a30;--ink:#e8f1f3;--sub:#8ea5ac;--line:#25393f;--in:#6ea0ff;--out:#ff7a8b;--brand:#2dd4bf;--brand2:#0f766e;--chip:#1f343a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;display:flex;justify-content:center}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:430px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#view{flex:1;overflow-y:auto;padding-bottom:calc(124px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;padding:14px 16px 12px;border-radius:0 0 22px 22px}
.top .row{display:flex;justify-content:space-between;align-items:center}
.mon{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:700;justify-content:center}
.mon button{font-size:18px;padding:2px 8px;color:#fff}
.sum{display:flex;gap:18px;margin-top:10px}
.sum div{flex:1}.sum small{opacity:.85;font-size:12px}.sum b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 8px 0}
.cal .h{text-align:center;color:var(--sub);font-size:11px;padding:4px 0}
.cal .d{min-height:50px;border-radius:10px;padding:3px 1px;text-align:center;font-size:12px;position:relative}
.cal .d.sel{background:var(--card);box-shadow:inset 0 0 0 2px var(--brand)}
.cal .d i{display:block;font-style:normal;font-size:10px;line-height:1.25;font-variant-numeric:tabular-nums}
.i-in{color:var(--in)}.i-out{color:var(--out)}
.list{margin:10px 12px;background:var(--card);border-radius:16px;padding:4px 14px}
.list h3{font-size:13px;color:var(--sub);padding:10px 0 4px;font-weight:500;display:flex;justify-content:space-between}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--chip);flex:none}
.tx .m{flex:1;min-width:0}.tx .m b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m small{color:var(--sub);font-size:11px}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.tx .x{color:var(--sub);padding:4px 6px;font-size:16px}
.empty{color:var(--sub);text-align:center;padding:22px 0}
.fab{position:absolute;right:18px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--brand);color:#fff;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:5}
.nav{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:26px;display:flex;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:6}
.nav button{flex:1;padding:8px 0 6px;border-radius:20px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:19px}.nav button.on{background:var(--chip);color:var(--brand);font-weight:700}
.pg{padding:16px 14px 6px}.pg h2{font-size:20px;margin-bottom:12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.bar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.bar.over i{background:var(--out)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{color:var(--sub);font-size:12px}
.bin{width:110px;text-align:right;font:inherit;color:var(--ink);background:var(--chip);border:0;border-radius:8px;padding:6px 8px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}.seg button{flex:1;padding:7px;border-radius:10px;color:var(--sub)}.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.set{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}.set:first-child{border-top:0}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:96%;overflow-y:auto}
.disp{text-align:right;font-size:32px;font-weight:700;padding:10px 4px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:7px 11px;border-radius:16px;background:var(--chip);font-size:13px}
.chip.on{background:var(--brand);color:#fff}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.keys button{padding:13px 0;border-radius:12px;background:var(--chip);font-size:18px}
.keys .sv{grid-column:span 1;background:var(--brand);color:#fff;font-size:14px;font-weight:700;grid-row:span 4}
.keys .sv:disabled{opacity:.4}
.memo{width:100%;border:0;background:var(--chip);color:var(--ink);border-radius:10px;padding:10px;font:inherit;margin-top:4px}
.toast{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:18px;font-size:13px;z-index:20}
.tag{font-size:11px;padding:3px 8px;border-radius:8px;flex:none}
.g0{background:rgba(224,71,91,.15);color:var(--out)}.g1{background:rgba(217,119,6,.16);color:#d97706}.g2{background:rgba(124,58,237,.16);color:#8b5cf6}
.top{padding-bottom:40px}
.sumcard{margin:-26px 12px 0;background:var(--card);border-radius:18px;padding:14px 16px 12px;box-shadow:0 6px 18px rgba(15,60,60,.14);position:relative}
.sc{display:flex}.sc>div{flex:1}.sc>div+div{border-left:1px solid var(--line);padding-left:16px}
.sc small{color:var(--sub);font-size:12px}.sc b{display:block;font-size:21px;margin-top:2px;font-variant-numeric:tabular-nums}
.sc2{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.sc2 span{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.cd{background:#8b5cf6}.dot.cs{background:#f59e0b}
.cal{margin-top:8px}
.cal .d .dn{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;font-size:12px}
.cal .d.today .dn{background:var(--brand);color:var(--card);font-weight:700}
.cal .d{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;padding:4px 0 2px}
.cal .d i{width:100%;text-align:center;white-space:nowrap}
.ch{padding-bottom:12px}
.mg{font-size:12px;font-weight:500;padding:6px 12px;border-radius:14px;background:var(--chip);color:var(--brand)}
.tx[onclick]{cursor:pointer}
.tx[data-id]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tx.lift{opacity:.35}
.cal .d.drop{background:rgba(15,118,110,.18);box-shadow:inset 0 0 0 2px var(--brand)}
.ghost{position:fixed;z-index:50;pointer-events:none;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:8px 12px;box-shadow:0 10px 26px rgba(0,0,0,.28);font-size:14px}
.ghost .m{flex:1;min-width:0}.ghost .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ghost .m small{color:var(--sub);font-size:11px}
.ym{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:64px}
.ym small{font-size:11px;font-weight:500;opacity:.75;letter-spacing:.03em}
.pg .mon button{color:var(--ink)}
.bnr{display:block;width:calc(100% - 24px);margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:var(--chip);color:var(--sub);font-size:12px;text-align:left}
.rfb{position:absolute;top:10px;right:12px;z-index:7;width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--brand);box-shadow:0 1px 6px rgba(0,0,0,.22);font-size:17px;line-height:1;display:grid;place-items:center}
.rfb:active{transform:rotate(180deg)}
html,body{overflow:hidden;overscroll-behavior:none}
.hd{position:sticky;top:0;z-index:4;background:var(--bg);padding-bottom:6px}
.stk{position:sticky;top:0;z-index:3;background:var(--bg);margin:-16px -14px 0;padding:16px 14px 8px}
.stk h2{margin-bottom:8px}
.pg>h2:first-child{position:sticky;top:0;z-index:3;background:var(--bg);margin:-16px -14px 4px;padding:16px 14px 10px}
.pg>.row2:first-child{position:sticky;top:0;z-index:3;background:var(--bg);margin:-16px -14px 0;padding:14px 14px 8px!important}
.cal{touch-action:pan-y}
@keyframes anR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes anL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.cal.an-r{animation:anR .22s ease-out}.cal.an-l{animation:anL .22s ease-out}
#view.fixv{overflow-y:hidden;padding-bottom:0;display:flex;flex-direction:column}
.calwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.calfix{flex:none}
.calist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(124px + env(safe-area-inset-bottom,0px))}
input,select,textarea{font-size:16px!important}
.copy{margin:22px 0 4px;text-align:center;font-size:11px;color:var(--sub);line-height:1.7}.copy a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div id="app"><div id="view"></div><button class="rfb" onclick="hardReload()" aria-label="새로고침" title="새로고침">↻</button><button class="fab" onclick="openSheet()" aria-label="내역 추가">+</button>
<nav class="nav" id="nav"></nav><div id="layer"></div><input type="file" id="bf" accept=".json,application/json" hidden onchange="readBackup(this)"></div>
<script>
let CAT={식비:['🍚','생활비'],외식:['🍜','생활비'],교통비:['🚌','생활비'],문화생활:['🎵','생활비'],생필품:['🛒','생활비'],의류:['👕','생활비'],미용:['💄','생활비'],'의료/건강':['💊','생활비'],교육:['📖','생활비'],통신비:['📱','고정지출'],공과금:['💡','고정지출'],보험:['🏠','고정지출'],경조사:['🎁','특별지출'],세금:['🧾','특별지출']};
let INC={월급:'💵',용돈:'👛',이자:'％',투자:'📈',기타:'➕'};
const GROUPS=['생활비','고정지출','특별지출'];
const PAYS=['현금','롯데카드','국민카드','삼성카드'];
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid=1;const T=(d,type,cat,memo,amt,pay)=>({id:uid++,date:'2026-10-'+String(d).padStart(2,'0'),type,cat,memo,amt,pay});
let txs=[];
let budgets={생활비:0,고정지출:0,특별지출:0};
let S={tab:'cal',y:2026,m:10,sel:'2026-10-22',rtab:'cat',page:null,cf:'전체'};
const key=(y,m)=>y+'-'+String(m).padStart(2,'0');
const monthTx=()=>{ensureGen(S.y,S.m);return txs.filter(t=>t.date.startsWith(key(S.y,S.m)))};
const sumBy=(l,type)=>l.filter(t=>t.type===type).reduce((a,t)=>a+t.amt,0);
const icon=t=>ico(t.type,t.cat);
function txRow(t){return `<div class="tx" data-id="${t.id}" onclick="openEdit(${t.id})"><div class="ic">${icon(t)}</div><div class="m"><b>${esc(t.memo||t.cat)}</b><small>${t.cat} · ${t.pay}${t.rec?' · 🔁':''}</small></div><span class="amt ${t.type==='in'?'i-in':t.type==='out'?'i-out':''}">${won(t.amt)}</span></div>`}
function mnav(){return `<div class="mon"><button onclick="mv(-1)" aria-label="이전 달">‹</button><span class="ym"><small>${S.y}</small>${S.m}월</span><button onclick="mv(1)" aria-label="다음 달">›</button></div>`}
function mv(d){S.m+=d;if(S.m<1){S.m=12;S.y--}if(S.m>12){S.m=1;S.y++}S.sel=key(S.y,S.m)===TODAY.slice(0,7)?TODAY:key(S.y,S.m)+'-01';S.anim=d;render()}
function vCal(){const an=S.anim||0;S.anim=0;
 const l=monthTx(),inc=sumBy(l,'in'),out=sumBy(l,'out'),cd=l.filter(t=>t.type==='out'&&isCard(t.pay)).reduce((a,t)=>a+t.amt,0),cs=out-cd;
 const first=new Date(S.y,S.m-1,1).getDay(),days=new Date(S.y,S.m,0).getDate();
 let g=['일','월','화','수','목','금','토'].map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(first);
 for(let d=1;d<=days;d++){const k=key(S.y,S.m)+'-'+String(d).padStart(2,'0'),dl=l.filter(t=>t.date===k),i=sumBy(dl,'in'),o=sumBy(dl,'out');
  g+=`<button class="d ${k===S.sel?'sel':''} ${k===TODAY?'today':''}" data-date="${k}" onclick="S.sel='${k}';render()"><span class="dn">${d}</span>${i?`<i class="i-in">${i.toLocaleString()}</i>`:''}${o?`<i class="i-out">${o.toLocaleString()}</i>`:''}</button>`}
 const dl=l.filter(t=>t.date===S.sel);
 return `<div class="calwrap"><div class="calfix"><div class="hd"><div class="top">${mnav()}</div><div class="sumcard"><div class="sc"><div><small>수입</small><b class="i-in">${won(inc)}</b></div><div><small>지출</small><b class="i-out">${won(out)}</b></div></div><div class="sc2"><span><i class="dot cd"></i>카드 지출 ${won(cd)}</span><span><i class="dot cs"></i>현금 지출 ${won(cs)}</span></div></div>
 </div>${bk()}<div class="cal ${an>0?'an-r':an<0?'an-l':''}">${g}</div></div><div class="calist"><div class="list"><h3><span>${+S.sel.slice(5,7)}월 ${+S.sel.slice(8)}일</span><span><span class="i-in">${won(sumBy(dl,'in'))}</span> / <span class="i-out">${won(sumBy(dl,'out'))}</span></span></h3>${dl.length?dl.map(txRow).join(''):'<div class="empty">내역이 없어요. + 버튼으로 추가해 보세요.</div>'}</div></div></div>`}
function vBud(){
 const l=monthTx();const spent=g=>l.filter(t=>t.type==='out'&&(CAT[t.cat]||[])[1]===g).reduce((a,t)=>a+t.amt,0);
 const tb=GROUPS.reduce((a,g)=>a+budgets[g],0),ts=sumBy(l,'out');
 return `<div class="pg"><div class="stk"><h2>예산</h2>${mnav()}</div><div class="card" style="margin-top:12px"><div class="sub">${S.m}월 전체 지출 / 예산</div><div class="big">${won(ts)}</div><div class="bar ${tb&&ts>tb?'over':''}"><i style="width:${(tb?Math.min(100,ts/tb*100):0)}%"></i></div><div class="sub" style="margin-top:6px">${!tb?'아래에서 그룹별 예산을 입력해 보세요':ts>tb?won(ts-tb)+' 초과':'남은 예산 '+won(tb-ts)}</div></div>
 ${GROUPS.map(g=>{const s=spent(g),b=budgets[g];return `<div class="card"><div class="row2"><b>${g}</b><label class="sub">예산 <input class="bin" type="number" inputmode="numeric" value="${b}" onchange="budgets['${g}']=+this.value||0;render()"></label></div><div class="row2" style="margin-top:8px"><span class="amt">${won(s)}</span><span class="sub">${b?Math.round(s/b*100):0}%</span></div><div class="bar ${s>b?'over':''}"><i style="width:${b?Math.min(100,s/b*100):0}%"></i></div></div>`}).join('')}</div>`}
function vRep(){
 const l=monthTx(),out=sumBy(l,'out'),inc=sumBy(l,'in');
 const by={};l.filter(t=>t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 const card={};l.filter(t=>t.type==='out').forEach(t=>card[t.pay]=(card[t.pay]||0)+t.amt);
 const body=S.rtab==='cat'?`<div class="card"><div class="sub">지출 합계</div><div class="big">${won(out)}</div><div class="sub">수입 ${won(inc)} · 순수입 ${won(inc-out)}</div></div>
  <div class="card">${rows.length?rows.map(([c,v])=>`<div style="margin-bottom:12px"><div class="row2"><span>${(CAT[c]||['❔'])[0]} ${c} <span class="sub">${Math.round(v/out*100)}%</span></span><span class="amt">${won(v)}</span></div><div class="bar"><i style="width:${v/rows[0][1]*100}%"></i></div></div>`).join(''):'<div class="empty">이번 달 지출이 없어요.</div>'}</div>`
  :`<div class="card"><div class="sub">결제수단별 지출</div>${Object.entries(card).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin-top:12px"><div class="row2"><span>${c}</span><span class="amt">${won(v)}</span></div><div class="bar"><i style="width:${v/out*100}%"></i></div></div>`).join('')||'<div class="empty">내역이 없어요.</div>'}</div>`;
 return `<div class="pg"><div class="stk"><h2>리포트</h2>${mnav()}</div><div class="seg" style="margin:12px 0"><button class="${S.rtab==='cat'?'on':''}" onclick="S.rtab='cat';render()">카테고리</button><button class="${S.rtab==='pay'?'on':''}" onclick="S.rtab='pay';render()">결제수단</button></div>${body}</div>`}
function vAssOld(){
 const cash=100000+txs.reduce((a,t)=>a+(t.pay==='현금'?(t.type==='in'?t.amt:-t.amt):0),0);
 const cardOut=p=>txs.filter(t=>t.type==='out'&&t.pay===p).reduce((a,t)=>a+t.amt,0);
 return `<div class="pg"><h2>자산</h2><div class="card"><div class="sub">현금 잔액 (시작 10만원 + 내역 반영)</div><div class="big">${won(cash)}</div></div>
 <div class="card"><b>신용카드 사용액</b>${PAYS.slice(1).map(p=>`<div class="set"><span>${p}</span><span class="amt i-out">${won(cardOut(p))}</span></div>`).join('')}</div></div>`}
function vSet(){return `<div class="pg"><h2>설정</h2><div class="card">
